<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ส่งงาน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
</head>
<body data-root="../">
  <main class="container py-4" style="max-width:860px">
    <div id="loading"><div class="skeleton" style="height:300px;border-radius:18px"></div></div>
    <div id="content" class="d-none fade-up">
      <a href="#" class="small text-decoration-none" id="backLink"><i class="bi bi-arrow-left me-1"></i>กลับไปหน้าโครงการ</a>
      <div class="card mt-3 mb-3">
        <div class="card-body p-4">
          <div class="d-flex align-items-center gap-3 mb-3">
            <span class="act-icon lg soft-pink"><i class="bi bi-cloud-arrow-up"></i></span>
            <div class="min-w-0"><div class="small text-muted" id="aProject"></div><h1 class="h3 mb-0" id="aTitle"></h1></div>
          </div>
          <p class="prose" id="aDesc"></p>
          <div class="d-flex flex-wrap gap-2" id="aInfo"></div>
          <div id="aDoc"></div>
        </div>
      </div>

      <div class="card mb-3 d-none" id="mySub">
        <div class="card-header d-flex justify-content-between align-items-center"><span><i class="bi bi-inbox me-2 text-primary"></i>งานที่ส่งแล้ว</span><span id="subBadge"></span></div>
        <div class="card-body" id="subBody"></div>
      </div>

      <form class="card" id="subForm" novalidate>
        <div class="card-header"><i class="bi bi-send me-2 text-primary"></i><span id="formTitle">ส่งงาน</span></div>
        <div class="card-body">
          <div class="mb-3 d-none" data-type="file">
            <label class="form-label">แนบไฟล์</label>
            <label class="dropzone d-block" id="drop">
              <input type="file" class="d-none" id="file">
              <i class="bi bi-cloud-arrow-up fs-1 text-primary"></i>
              <div class="fw-semibold" id="fileName">คลิกเพื่อเลือกไฟล์ หรือลากไฟล์มาวาง</div>
              <div class="small text-muted" id="fileHint"></div>
            </label>
          </div>
          <div class="mb-3 d-none" data-type="link">
            <label class="form-label" for="link">ลิงก์ผลงาน</label>
            <input type="url" class="form-control" id="link" placeholder="https://drive.google.com/...">
            <div class="form-text">ถ้าใช้ Google Drive ให้ตั้งค่าแชร์เป็น "ทุกคนที่มีลิงก์ดูได้"</div>
          </div>
          <div class="mb-3 d-none" data-type="text">
            <label class="form-label" for="text">พิมพ์คำตอบ</label>
            <textarea class="form-control" id="text" rows="6"></textarea>
          </div>
          <button class="btn btn-primary btn-lg w-100" type="submit" id="sendBtn"><i class="bi bi-send me-1"></i>ส่งงาน</button>
        </div>
      </form>
      <div class="alert alert-secondary d-none" id="closedBox"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script>
    const me = Auth.require();
    const id = UI.qs('id');
    let act = null, file = null;
    const SUB = {
      submitted: { label: 'ส่งแล้ว รอตรวจ', cls: 'warning', icon: 'hourglass-split' },
      graded:    { label: 'ตรวจแล้ว',       cls: 'success', icon: 'check-circle' },
      revise:    { label: 'ให้แก้ไขและส่งใหม่', cls: 'danger', icon: 'arrow-repeat' }
    };

    if (me) { UI.loadSettings(); load(); }

    async function load() {
      try {
        act = await API.call('activity.get', { activity_id: id });
        const s = act.settings;
        document.title = act.title;
        UI.$('#backLink').href = '../project.html?id=' + act.project.project_id;
        UI.$('#aProject').textContent = act.project.title;
        UI.$('#aTitle').textContent = act.title;
        UI.$('#aDesc').textContent = act.description || '';
        UI.$('#aInfo').innerHTML = `<span class="chip"><i class="bi bi-clock"></i>${PUI.actWindow(act)}</span>
          <span class="chip"><i class="bi bi-star"></i>คะแนนเต็ม <b>${s.max_score}</b></span>
          <span class="chip"><i class="bi bi-arrow-repeat"></i>${s.allow_resubmit ? 'ส่งซ้ำได้' : 'ส่งได้ครั้งเดียว'}</span>`;
        UI.$('#aDoc').innerHTML = act.content_url ? `<a href="${UI.esc(act.content_url)}" target="_blank" rel="noopener" class="btn btn-soft mt-3"><i class="bi bi-file-earmark-text me-1"></i>เอกสารประกอบ</a>` : '';
        s.submit_types.forEach(t => UI.$(`[data-type="${t}"]`).classList.remove('d-none'));
        const exts = s.allowed_ext ? s.allowed_ext.split(',').filter(Boolean) : [];
        UI.$('#file').accept = exts.map(x => '.' + x).join(',');
        UI.$('#fileHint').textContent = `${exts.length ? 'รองรับ ' + exts.join(', ') + ' · ' : ''}ขนาดไม่เกิน ${s.max_size_mb} MB`;

        const sub = act.submission;
        if (sub) {
          UI.$('#mySub').classList.remove('d-none');
          const st = SUB[sub.status] || SUB.submitted;
          UI.$('#subBadge').innerHTML = `<span class="badge-soft ${st.cls}"><i class="bi bi-${st.icon}"></i>${st.label}</span>`;
          UI.$('#subBody').innerHTML = `
            <div class="small text-muted mb-2">ส่งเมื่อ ${UI.thaiDate(sub.submitted_at, true)}</div>
            <div class="vstack gap-2 mb-2">
              ${sub.file_url ? `<a href="${UI.esc(sub.file_url)}" target="_blank" rel="noopener"><i class="bi bi-file-earmark me-1"></i>${UI.esc(sub.file_name || 'ไฟล์ที่ส่ง')}</a>` : ''}
              ${sub.link_url ? `<a href="${UI.esc(sub.link_url)}" target="_blank" rel="noopener" class="text-break"><i class="bi bi-link-45deg me-1"></i>${UI.esc(sub.link_url)}</a>` : ''}
              ${sub.text_answer ? `<div class="border rounded-3 p-2 prose small">${UI.esc(sub.text_answer)}</div>` : ''}
            </div>
            ${sub.status !== 'submitted' ? `<div class="alert ${sub.status === 'revise' ? 'alert-danger' : 'alert-success'} mb-0 mt-3">
              ${sub.score !== '' ? `<div class="fs-5 fw-bold font-prompt">คะแนน ${UI.esc(sub.score)}/${s.max_score}</div>` : ''}
              ${sub.feedback ? `<div class="prose"><i class="bi bi-chat-quote me-1"></i>${UI.esc(sub.feedback)}</div>` : ''}</div>` : ''}`;
          UI.$('#link').value = sub.link_url || '';
          UI.$('#text').value = sub.text_answer || '';
          UI.$('#formTitle').textContent = sub.status === 'revise' ? 'แก้ไขและส่งงานใหม่' : 'ส่งงานใหม่ (แทนที่งานเดิม)';
        }
        const canSend = act.is_participant && act.window === 'open' && (!sub || s.allow_resubmit || sub.status === 'revise');
        UI.$('#subForm').classList.toggle('d-none', !canSend);
        if (!canSend) {
          const box = UI.$('#closedBox');
          box.classList.remove('d-none');
          box.textContent = !act.is_participant ? 'คุณยังไม่ได้รับอนุมัติให้เข้าร่วมโครงการนี้'
            : act.window === 'notyet' ? `เปิดรับงาน ${PUI.fmtDT(act.open_at)}` : act.window === 'closed' ? 'ปิดรับงานแล้ว' : 'ส่งงานแล้ว กิจกรรมนี้ส่งได้ครั้งเดียว';
        }
        UI.$('#loading').classList.add('d-none');
        UI.$('#content').classList.remove('d-none');
      } catch (err) {
        await UI.error(err);
        history.length > 1 ? history.back() : (location.href = 'dashboard.html');
      }
    }

    function pickFile(f) {
      if (!f) return;
      const s = act.settings;
      const ext = (f.name.split('.').pop() || '').toLowerCase();
      const exts = s.allowed_ext ? s.allowed_ext.split(',').filter(Boolean) : [];
      if (exts.length && !exts.includes(ext)) return UI.error(`ไม่รองรับไฟล์ .${ext}`);
      if (f.size > s.max_size_mb * 1024 * 1024) return UI.error(`ไฟล์มีขนาดเกิน ${s.max_size_mb} MB`);
      file = f;
      UI.$('#fileName').innerHTML = `<i class="bi bi-file-earmark-check text-success me-1"></i>${UI.esc(f.name)} <span class="text-muted small">(${(f.size / 1024 / 1024).toFixed(2)} MB)</span>`;
    }
    UI.$('#file').addEventListener('change', e => pickFile(e.target.files[0]));
    const drop = UI.$('#drop');
    ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('drag'); }));
    ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('drag'); }));
    drop.addEventListener('drop', e => pickFile(e.dataTransfer.files[0]));

    const toBase64 = f => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = () => res(String(r.result).split(',')[1]);
      r.onerror = () => rej(new Error('อ่านไฟล์ไม่สำเร็จ'));
      r.readAsDataURL(f);
    });

    UI.$('#subForm').addEventListener('submit', async e => {
      e.preventDefault();
      const link = UI.$('#link').value.trim();
      const text = UI.$('#text').value.trim();
      if (!file && !link && !text && !(act.submission && act.submission.file_url)) return UI.error('กรุณาแนบไฟล์ ใส่ลิงก์ หรือพิมพ์คำตอบ');
      const btn = UI.$('#sendBtn');
      UI.btnLoading(btn, true, file ? 'กำลังอัปโหลดไฟล์...' : 'กำลังส่ง...');
      try {
        const payload = { activity_id: id, link_url: link, text_answer: text };
        if (file) payload.file = { name: file.name, mime: file.type, data: await toBase64(file) };
        await API.call('submission.submit', payload);
        file = null;
        await UI.success('ส่งงานเรียบร้อย', 'ผู้สร้างหลักสูตรจะตรวจและให้คะแนนภายหลัง');
        location.reload();
      } catch (err) { UI.error(err, 'ส่งงานไม่สำเร็จ'); UI.btnLoading(btn, false); }
    });
  </script>
</body>
</html>
