<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>แดชบอร์ด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
</head>
<body data-root="../">
  <div class="app">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="app-content">
        <div class="hero-card mb-4 fade-up">
          <div class="row align-items-center g-3">
            <div class="col-md-8">
              <div class="opacity-75 small mb-1" id="today"></div>
              <h2 class="h3 fw-bold mb-1">สวัสดี, <span id="hello"></span> 👋</h2>
              <p class="mb-0 opacity-75">พร้อมเรียนรู้สิ่งใหม่วันนี้หรือยัง? เลือกโครงการที่สนใจแล้วเริ่มกันเลย</p>
            </div>
            <div class="col-md-4 text-md-end">
              <div class="d-inline-flex align-items-center gap-2 glass px-3 py-2">
                <i class="bi bi-calendar3"></i>
                <span>ปีงบประมาณ</span>
                <select class="form-select form-select-sm bg-transparent text-white border-0 fw-semibold" id="fySelect" style="width:auto" aria-label="เลือกปีงบประมาณ"></select>
              </div>
            </div>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-primary"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value">0</div><div class="stat-label">โครงการที่เข้าร่วม</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-success"><i class="bi bi-check2-circle"></i></div><div><div class="stat-value">0</div><div class="stat-label">กิจกรรมที่ทำแล้ว</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-warning"><i class="bi bi-hourglass-split"></i></div><div><div class="stat-value">0</div><div class="stat-label">รอดำเนินการ</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-pink"><i class="bi bi-award"></i></div><div><div class="stat-value">0</div><div class="stat-label">ผ่านการอบรม</div></div></div></div>
        </div>

        <div class="row g-3">
          <div class="col-lg-8">
            <div class="card h-100">
              <div class="card-header"><i class="bi bi-journal-bookmark me-2 text-primary"></i>โครงการของฉัน</div>
              <div class="card-body">
                <div class="empty-state">
                  <div class="icon soft-primary"><i class="bi bi-journal-plus"></i></div>
                  <h5>ยังไม่ได้เข้าร่วมโครงการ</h5>
                  <p>ระบบลงทะเบียนเข้าร่วมโครงการจะเปิดให้ใช้งานเร็ว ๆ นี้</p>
                  <button class="btn btn-primary" disabled><i class="bi bi-search me-1"></i>ค้นหาโครงการ</button>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-4">
            <div class="card h-100">
              <div class="card-header"><i class="bi bi-person-badge me-2 text-primary"></i>ข้อมูลของฉัน</div>
              <div class="card-body text-center">
                <span class="avatar lg mb-3" id="pAvatar"></span>
                <h5 class="mb-1" id="pName"></h5>
                <div class="text-muted small mb-2" id="pEmail"></div>
                <div class="mb-3" id="pRole"></div>
                <div class="text-start small vstack gap-2 border-top pt-3">
                  <div class="d-flex gap-2"><i class="bi bi-briefcase text-muted"></i><span id="pPos"></span></div>
                  <div class="d-flex gap-2"><i class="bi bi-building text-muted"></i><span id="pOrg"></span></div>
                </div>
                <a href="profile.html" class="btn btn-soft w-100 mt-3"><i class="bi bi-pencil-square me-1"></i>แก้ไขข้อมูล</a>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script>
    const me = Auth.require(['user', 'creator', 'admin']);
    if (me) {
      Layout.init(me, { active: 'dashboard', title: 'แดชบอร์ด' });
      UI.$('#hello').textContent = me.first_name;
      UI.$('#today').textContent = UI.thaiDateLong(new Date().toISOString());
      UI.$('#pAvatar').textContent = UI.initials(me);
      UI.$('#pName').textContent = UI.fullName(me);
      UI.$('#pEmail').textContent = me.email;
      UI.$('#pRole').innerHTML = UI.roleBadge(me.role);
      UI.$('#pPos').textContent = me.position || '-';
      UI.$('#pOrg').textContent = me.organization || '-';
      API.call('fy.list').then(list => {
        const sel = UI.$('#fySelect');
        sel.innerHTML = list.map(f => `<option class="text-dark" value="${f.fy_id}" ${f.is_active === 'TRUE' ? 'selected' : ''}>${UI.esc(f.year)}</option>`).join('');
      }).catch(() => { });
    }
  </script>
</body>
</html>
