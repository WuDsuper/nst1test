<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ค้นหาโครงการ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
</head>
<body data-root="../">
  <div class="app">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="app-content">
        <div class="page-head">
          <div>
            <h1>โครงการที่เปิดรับ</h1>
            <p>เลือกโครงการที่สนใจ แล้วกดลงทะเบียนเข้าร่วม</p>
          </div>
        </div>

        <div class="card mb-3">
          <div class="card-body">
            <div class="row g-2">
              <div class="col-md-4"><select class="form-select" id="fy" aria-label="ปีงบประมาณ"></select></div>
              <div class="col-md-8">
                <div class="input-group">
                  <span class="input-group-text"><i class="bi bi-search"></i></span>
                  <input type="search" class="form-control" id="q" placeholder="ค้นหาชื่อโครงการ หรือรายละเอียด">
                </div>
              </div>
            </div>
            <div class="tab-pills mt-3" id="tabs"></div>
          </div>
        </div>

        <div class="row g-3" id="grid">
          <div class="col-sm-6 col-xl-4"><div class="skeleton" style="height:340px;border-radius:18px"></div></div>
          <div class="col-sm-6 col-xl-4"><div class="skeleton" style="height:340px;border-radius:18px"></div></div>
          <div class="col-sm-6 col-xl-4 d-none d-xl-block"><div class="skeleton" style="height:340px;border-radius:18px"></div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script>
    const me = Auth.require();
    let items = [];
    let tab = 'all';

    if (me) {
      Layout.init(me, { active: 'explore', title: 'ค้นหาโครงการ' });
      PUI.fillFySelect(UI.$('#fy')).then(load).catch(UI.error);
      UI.$('#fy').addEventListener('change', load);
      UI.$('#q').addEventListener('input', render);
    }

    async function load() {
      try {
        items = await API.call('project.list', { scope: 'public', fy_id: UI.$('#fy').value });
        render();
      } catch (err) { UI.error(err); }
    }

    const FILTERS = {
      all: () => true,
      open: p => PUI.state(p).canJoin && !p.my_status,
      mine: p => !!p.my_status
    };

    function render() {
      const tabs = [['all', 'ทั้งหมด'], ['open', 'สมัครได้'], ['mine', 'ที่ฉันลงทะเบียน']];
      UI.$('#tabs').innerHTML = tabs.map(([k, l]) => `<button type="button" class="${tab === k ? 'active' : ''}" data-tab="${k}">${l}<span class="n">${items.filter(FILTERS[k]).length}</span></button>`).join('');
      const q = UI.$('#q').value.trim().toLowerCase();
      const list = items.filter(FILTERS[tab]).filter(p => !q || (p.title + ' ' + p.description + ' ' + p.code).toLowerCase().includes(q));
      UI.$('#grid').innerHTML = list.length ? list.map(p => PUI.card(p, '../')).join('')
        : `<div class="col-12"><div class="card"><div class="empty-state">
            <div class="icon soft-primary"><i class="bi bi-search"></i></div>
            <h5>${items.length ? 'ไม่พบโครงการที่ตรงกับเงื่อนไข' : 'ยังไม่มีโครงการที่เปิดในปีงบประมาณนี้'}</h5>
            <p class="mb-0">ลองเปลี่ยนปีงบประมาณ หรือคำค้นหา</p></div></div></div>`;
    }

    UI.$('#tabs').addEventListener('click', e => {
      const b = e.target.closest('[data-tab]');
      if (b) { tab = b.dataset.tab; render(); }
    });
  </script>
</body>
</html>
