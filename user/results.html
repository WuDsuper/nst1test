<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ผลการอบรม</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
</head>
<body data-root="../">
  <div class="app">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="app-content">
        <div class="page-head">
          <div>
            <h1>ผลการอบรมของฉัน</h1>
            <p id="who">คะแนนแบบทดสอบ งานที่ส่ง และความก้าวหน้าในทุกโครงการ</p>
          </div>
          <div class="d-flex flex-wrap gap-2 no-print">
            <select class="form-select" id="fy" style="width:auto" aria-label="ปีงบประมาณ"></select>
            <button class="btn btn-light" id="btnPrint"><i class="bi bi-printer me-1"></i>พิมพ์</button>
          </div>
        </div>

        <div class="row g-3 mb-4">
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-primary"><i class="bi bi-folder2-open"></i></div><div><div class="stat-value" id="sJoined">–</div><div class="stat-label">โครงการที่เข้าร่วม</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-success"><i class="bi bi-award"></i></div><div><div class="stat-value" id="sDone">–</div><div class="stat-label">ผ่านการอบรม</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-info"><i class="bi bi-clock-history"></i></div><div><div class="stat-value" id="sHours">–</div><div class="stat-label">ชั่วโมงอบรมสะสม</div></div></div></div>
          <div class="col-6 col-lg-3"><div class="card stat-card"><div class="stat-icon soft-pink"><i class="bi bi-ui-checks"></i></div><div><div class="stat-value" id="sQuiz">–</div><div class="stat-label" id="sQuizL">คะแนนสอบเฉลี่ย</div></div></div></div>
        </div>

        <div class="card mb-4 no-print d-none" id="todoCard">
          <div class="card-header"><i class="bi bi-alarm me-2 text-danger"></i>กิจกรรมที่ต้องทำ</div>
          <div class="list-group list-group-flush" id="todo"></div>
        </div>

        <div id="list"><div class="skeleton" style="height:240px"></div></div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script src="../assets/js/reports.js"></script>
  <script>
    const me = Auth.require();
    const esc = UI.esc;
    let data = null;

    if (me) {
      Layout.init(me, { active: 'results', title: 'ผลการอบรม' });
      UI.$('#who').textContent = `${UI.fullName(me)}${me.organization ? ' · ' + me.organization : ''}`;
      UI.$('#btnPrint').addEventListener('click', () => window.print());
      init();
    }

    async function init() {
      try {
        const sel = UI.$('#fy');
        const [, d] = await Promise.all([PUI.fillFySelect(sel, { allOption: true }), API.call('report.my')]);
        sel.value = '';
        data = d;
        sel.addEventListener('change', render);
        render();
      } catch (err) { UI.error(err); }
    }

    function actLink(a) {
      if (a.type === 'quiz') return `quiz.html?id=${a.activity_id}`;
      if (a.type === 'assignment') return `assignment.html?id=${a.activity_id}`;
      return '';
    }

    function resultText(a) {
      const c = a.result;
      if (a.type === 'quiz' && c.best) {
        const main = `<b>${RPT.num(c.best.score)}</b><span class="text-muted">/${RPT.num(c.best.max)}</span> <span class="small text-muted">(${RPT.num(c.best.percent, 1)}%)</span>`;
        const extra = c.attempts > 1 ? `<div class="small text-muted">ทำ ${c.attempts} ครั้ง · ครั้งแรก ${RPT.num(c.first.percent, 0)}%</div>` : '';
        return main + extra;
      }
      if (a.type === 'assignment' && c.score !== undefined) return `<b>${RPT.num(c.score)}</b><span class="text-muted">/${RPT.num(c.max)}</span>`;
      if (a.type === 'content' && c.at) return `<span class="small text-muted">${UI.thaiDate(c.at)}</span>`;
      return '';
    }

    function render() {
      const fy = UI.$('#fy').value;
      const items = data.items.filter(x => !fy || x.project.fy_id === fy);
      const members = items.filter(x => x.status !== 'pending');
      const completed = items.filter(x => x.status === 'completed');
      const quizPcts = [];
      members.forEach(x => x.activities.forEach(a => { if (a.type === 'quiz' && a.result.best) quizPcts.push(a.result.best.percent); }));
      UI.$('#sJoined').textContent = members.length;
      UI.$('#sDone').textContent = completed.length;
      UI.$('#sHours').textContent = RPT.num(completed.reduce((s, x) => s + (Number(x.project.hours) || 0), 0), 1);
      UI.$('#sQuiz').textContent = quizPcts.length ? RPT.pct(RPT.mean(quizPcts), 0) : '-';
      UI.$('#sQuizL').textContent = quizPcts.length ? `คะแนนสอบเฉลี่ย (${quizPcts.length} ชุด)` : 'คะแนนสอบเฉลี่ย';

      // กิจกรรมที่ต้องทำ
      const todo = [];
      members.filter(x => x.status === 'approved').forEach(x => x.activities.forEach(a => {
        if (a.window !== 'open' || !['todo', 'inprogress', 'failed', 'revise'].includes(a.result.state)) return;
        todo.push({ a, p: x.project });
      }));
      todo.sort((x, y) => (x.a.close_at || '9999') < (y.a.close_at || '9999') ? -1 : 1);
      UI.$('#todoCard').classList.toggle('d-none', !todo.length);
      UI.$('#todo').innerHTML = todo.slice(0, 6).map(({ a, p }) => {
        const href = actLink(a) || `../project.html?id=${p.project_id}`;
        const soon = a.close_at && (new Date(a.close_at) - Date.now()) < 3 * 864e5;
        return `<a href="${href}" class="list-group-item list-group-item-action bg-transparent d-flex align-items-center gap-3 py-3">
          ${PUI.actIcon(a.type, 'sm')}
          <div class="min-w-0 flex-grow-1">
            <div class="fw-semibold text-truncate">${esc(a.title)}</div>
            <div class="small text-muted text-truncate">${esc(p.title)}</div>
          </div>
          <div class="text-end small">${PUI.myBadge(a.result.state)}${a.close_at ? `<div class="${soon ? 'text-danger fw-semibold' : 'text-muted'} mt-1"><i class="bi bi-clock me-1"></i>ปิด ${PUI.fmtDT(a.close_at)}</div>` : ''}</div>
        </a>`;
      }).join('');

      if (!items.length) {
        UI.$('#list').innerHTML = `<div class="card"><div class="empty-state">
          <div class="icon soft-primary"><i class="bi bi-award"></i></div>
          <h5>ยังไม่มีผลการอบรม${fy ? 'ในปีงบประมาณนี้' : ''}</h5>
          <p>ลงทะเบียนเข้าร่วมโครงการ แล้วทำกิจกรรมให้ครบเพื่อผ่านการอบรม</p>
          <a href="projects.html" class="btn btn-primary"><i class="bi bi-search me-1"></i>ค้นหาโครงการ</a></div></div>`;
        return;
      }

      UI.$('#list').innerHTML = items.map(x => {
        const p = x.project;
        const pr = x.progress;
        const head = `<div class="card-body d-flex flex-wrap gap-3 align-items-center">
            <div class="pj-thumb">${PUI.cover(p)}</div>
            <div class="min-w-0 flex-grow-1">
              <div class="small text-muted">${esc(p.code)} · ปีงบประมาณ ${esc(p.fy_year)}${p.hours ? ' · ' + esc(p.hours) + ' ชั่วโมง' : ''}</div>
              <a href="../project.html?id=${p.project_id}" class="h6 mb-1 d-block text-decoration-none text-body">${esc(p.title)}</a>
              <div class="small text-muted"><i class="bi bi-calendar-event me-1"></i>${PUI.dateRange(p.start_date, p.end_date)}</div>
            </div>
            <div class="text-end">
              ${PUI.enrollBadge(x.status)}
              ${x.status === 'completed' && x.completed_at ? `<div class="small text-muted mt-1">เมื่อ ${UI.thaiDate(x.completed_at)}</div>` : ''}
            </div>
          </div>`;
        if (x.status === 'pending') {
          return `<div class="card mb-3">${head}<div class="card-body border-top small text-muted"><i class="bi bi-hourglass-split me-1"></i>รอผู้จัดอนุมัติการลงทะเบียน จึงจะเห็นกิจกรรมและทำได้</div></div>`;
        }
        const pp = x.prepost;
        return `<div class="card mb-3">
          ${head}
          <div class="card-body border-top">
            ${pr && pr.total ? `<div class="d-flex align-items-center gap-3 mb-3">
              <div class="flex-grow-1">${PUI.progressBar(pr.percent, 8)}</div>
              <div class="small text-nowrap"><b>${pr.percent}%</b> · กิจกรรมบังคับ ${pr.done}/${pr.total} <span class="text-muted">(เกณฑ์ ${pr.pass_criteria}%)</span></div>
            </div>` : ''}
            ${pp && (pp.pre !== null || pp.post !== null) ? `<div class="pp-mini mb-3">
              <i class="bi bi-graph-up-arrow text-primary"></i><span>ก่อนเรียน <b>${RPT.pct(pp.pre, 0)}</b></span><i class="bi bi-arrow-right text-muted"></i>
              <span>หลังเรียน <b>${RPT.pct(pp.post, 0)}</b></span>${pp.gain !== null ? RPT.gainBadge(pp.gain) : ''}
            </div>` : ''}
            ${x.activities.length ? x.activities.map(a => {
              const link = actLink(a);
              const fb = a.type === 'assignment' && a.result.feedback ? `<div class="small mt-1"><i class="bi bi-chat-left-quote me-1 text-primary"></i>${esc(a.result.feedback)}</div>` : '';
              return `<div class="res-act">
                ${PUI.actIcon(a.type, 'sm')}
                <div class="min-w-0 flex-grow-1">
                  <div class="fw-semibold">${link ? `<a href="${link}" class="text-body text-decoration-none">${esc(a.title)}</a>` : esc(a.title)}</div>
                  <div class="small text-muted">${PUI.ACT[a.type].label}${a.quiz_kind === 'pre' ? ' · ก่อนเรียน' : a.quiz_kind === 'post' ? ' · หลังเรียน' : ''}${a.is_required ? '' : ' · ไม่บังคับ'}</div>
                  ${fb}
                </div>
                <div class="text-end">${resultText(a)}<div class="mt-1">${PUI.myBadge(a.result.state)}</div></div>
              </div>`;
            }).join('') : '<div class="small text-muted">ยังไม่มีกิจกรรมในโครงการนี้</div>'}
          </div>
        </div>`;
      }).join('');
    }
  </script>
</body>
</html>
