<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สร้างแบบทดสอบ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="../assets/css/style.css" rel="stylesheet">
  <script src="../assets/js/theme.js"></script>
</head>
<body data-root="../">
  <div class="app">
    <aside class="sidebar offcanvas-lg offcanvas-start" tabindex="-1" id="sidebar"></aside>
    <div class="app-main">
      <header class="topbar" id="topbar"></header>
      <main class="app-content">
        <div class="page-head">
          <div class="min-w-0">
            <a href="activities.html" class="small text-decoration-none" id="backLink"><i class="bi bi-arrow-left me-1"></i>กลับไปกิจกรรม</a>
            <h1 class="h3 mt-1" id="aTitle">แบบทดสอบ</h1>
            <p class="mb-0" id="aSub"></p>
          </div>
          <a class="btn btn-soft" id="resultLink"><i class="bi bi-clipboard-data me-1"></i>ผลการทำแบบทดสอบ</a>
        </div>

        <div class="alert alert-warning d-none" id="usedWarn"><i class="bi bi-exclamation-triangle me-1"></i>มีผู้ทำแบบทดสอบนี้แล้ว <b id="usedN"></b> ครั้ง การแก้ไขเฉลยหรือคะแนนจะไม่คำนวณผลเดิมใหม่</div>

        <div id="qList"></div>

        <div class="card mt-3">
          <div class="card-body">
            <div class="small text-muted mb-2">เพิ่มคำถาม</div>
            <div class="d-flex flex-wrap gap-2" id="addBtns"></div>
          </div>
        </div>

        <div class="save-bar">
          <span><i class="bi bi-question-circle me-1 text-primary"></i><b id="qCount">0</b> ข้อ · คะแนนรวม <b id="qTotal">0</b></span>
          <span class="small text-warning d-none" id="dirty"><i class="bi bi-circle-fill me-1" style="font-size:.5rem"></i>ยังไม่ได้บันทึก</span>
          <button class="btn btn-primary ms-auto" id="saveBtn"><i class="bi bi-check2-circle me-1"></i>บันทึกข้อสอบ</button>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="../assets/js/config.js"></script>
  <script src="../assets/js/mock.js"></script>
  <script src="../assets/js/utils.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/auth.js"></script>
  <script src="../assets/js/layout.js"></script>
  <script src="../assets/js/projects.js"></script>
  <script>
    const me = Auth.require(['creator', 'admin']);
    const id = UI.qs('id');
    const TYPES = {
      single:    { label: 'ตัวเลือกเดียว',  icon: 'record-circle' },
      multiple:  { label: 'หลายคำตอบ',     icon: 'check2-square' },
      truefalse: { label: 'ถูก / ผิด',      icon: 'toggles' },
      short:     { label: 'เติมคำตอบสั้น',  icon: 'input-cursor-text' },
      essay:     { label: 'อัตนัย (ตรวจเอง)', icon: 'text-paragraph' }
    };
    let qs = [];
    let dirty = false;

    UI.$('#addBtns').innerHTML = Object.entries(TYPES).map(([k, t]) =>
      `<button class="btn btn-soft" data-addq="${k}"><i class="bi bi-${t.icon} me-1"></i>${t.label}</button>`).join('');

    if (me) init();

    async function init() {
      Layout.init(me, { active: 'activities', title: 'สร้างแบบทดสอบ' });
      if (!id) { location.href = 'activities.html'; return; }
      try {
        const r = await API.call('question.list', { activity_id: id });
        const a = r.activity;
        UI.$('#aTitle').textContent = a.title;
        UI.$('#aSub').textContent = `${PUI.QUIZ_KIND[a.settings.quiz_kind]} · เกณฑ์ผ่าน ${a.settings.pass_score_pct}%` +
          (a.settings.time_limit_min ? ` · ${a.settings.time_limit_min} นาที` : ' · ไม่จำกัดเวลา');
        UI.$('#backLink').href = 'activities.html?project_id=' + a.project_id;
        UI.$('#resultLink').href = 'grading.html?id=' + id;
        if (r.attempt_count) { UI.$('#usedWarn').classList.remove('d-none'); UI.$('#usedN').textContent = r.attempt_count; }
        qs = r.questions.map(q => ({ ...q, options: q.options || [], answer: q.answer || [] }));
        render();
      } catch (err) { UI.error(err); }
    }

    function newQ(type) {
      const q = { type, question_text: '', image_url: '', options: [], answer: [], score: type === 'essay' ? 5 : 1, explanation: '' };
      if (type === 'single' || type === 'multiple') q.options = ['', '', '', ''];
      if (type === 'truefalse') { q.options = ['ถูก', 'ผิด']; q.answer = [0]; }
      return q;
    }

    function setDirty(v = true) { dirty = v; UI.$('#dirty').classList.toggle('d-none', !v); }
    function summary() {
      UI.$('#qCount').textContent = qs.length;
      UI.$('#qTotal').textContent = qs.reduce((s, q) => s + (Number(q.score) || 0), 0);
    }

    function optionsHtml(q, i) {
      if (q.type === 'truefalse') {
        return ['ถูก', 'ผิด'].map((t, j) => `<label class="opt-row ${q.answer[0] === j ? 'correct' : ''}">
          <input class="form-check-input" type="radio" name="ans${i}" data-i="${i}" data-correct="${j}" ${q.answer[0] === j ? 'checked' : ''}>
          <span class="form-control">${t}</span></label>`).join('');
      }
      if (q.type === 'single' || q.type === 'multiple') {
        const kind = q.type === 'single' ? 'radio' : 'checkbox';
        return q.options.map((o, j) => `<div class="opt-row ${q.answer.includes(j) ? 'correct' : ''}">
            <input class="form-check-input" type="${kind}" name="ans${i}" data-i="${i}" data-correct="${j}" ${q.answer.includes(j) ? 'checked' : ''} title="ทำเครื่องหมายเป็นคำตอบที่ถูก" aria-label="คำตอบที่ถูก">
            <input class="form-control" data-i="${i}" data-opt="${j}" value="${UI.esc(o)}" placeholder="ตัวเลือกที่ ${j + 1}">
            <button class="btn btn-sm btn-light" data-i="${i}" data-delopt="${j}" ${q.options.length <= 2 ? 'disabled' : ''} aria-label="ลบตัวเลือก"><i class="bi bi-x-lg"></i></button>
          </div>`).join('') +
          `<button class="btn btn-sm btn-link text-decoration-none px-0" data-i="${i}" data-addopt><i class="bi bi-plus-circle me-1"></i>เพิ่มตัวเลือก</button>
           <div class="form-text">ติ๊ก ${kind === 'radio' ? '◉' : '☑'} หน้าตัวเลือกที่เป็นคำตอบที่ถูก${q.type === 'multiple' ? ' (เลือกได้หลายข้อ ต้องตอบครบจึงได้คะแนน)' : ''}</div>`;
      }
      if (q.type === 'short') {
        return `<label class="form-label small">คำตอบที่ยอมรับ (บรรทัดละ 1 คำตอบ ไม่สนตัวพิมพ์เล็ก-ใหญ่)</label>
          <textarea class="form-control" rows="2" data-i="${i}" data-f="answer_lines" placeholder="เช่น&#10;PLC&#10;Professional Learning Community">${UI.esc(q.answer.join('\n'))}</textarea>`;
      }
      return `<div class="alert alert-light border small mb-0"><i class="bi bi-info-circle me-1"></i>ผู้เข้าอบรมพิมพ์คำตอบ ผู้สร้างหลักสูตรให้คะแนนเองในหน้า "ผลการทำแบบทดสอบ"</div>`;
    }

    function render() {
      summary();
      if (!qs.length) {
        UI.$('#qList').innerHTML = `<div class="card"><div class="empty-state"><div class="icon soft-purple"><i class="bi bi-ui-checks"></i></div>
          <h5>ยังไม่มีข้อสอบ</h5><p class="mb-0">เลือกประเภทคำถามด้านล่างเพื่อเริ่มสร้าง</p></div></div>`;
        return;
      }
      UI.$('#qList').innerHTML = qs.map((q, i) => `
        <div class="card q-card mb-3" id="q${i}">
          <div class="card-body">
            <div class="d-flex flex-wrap align-items-center gap-2 mb-3">
              <span class="q-no">${i + 1}</span>
              <select class="form-select form-select-sm" style="width:auto" data-i="${i}" data-f="type" aria-label="ประเภทคำถาม">
                ${Object.entries(TYPES).map(([k, t]) => `<option value="${k}" ${q.type === k ? 'selected' : ''}>${t.label}</option>`).join('')}
              </select>
              <div class="input-group input-group-sm" style="width:130px">
                <span class="input-group-text">คะแนน</span>
                <input type="number" class="form-control" min="0" step="0.5" value="${q.score}" data-i="${i}" data-f="score" aria-label="คะแนน">
              </div>
              <div class="ms-auto d-flex gap-1">
                <button class="btn btn-sm btn-light" data-move="-1" data-i="${i}" ${i === 0 ? 'disabled' : ''} aria-label="เลื่อนขึ้น"><i class="bi bi-arrow-up"></i></button>
                <button class="btn btn-sm btn-light" data-move="1" data-i="${i}" ${i === qs.length - 1 ? 'disabled' : ''} aria-label="เลื่อนลง"><i class="bi bi-arrow-down"></i></button>
                <button class="btn btn-sm btn-light" data-dup="${i}" title="ทำสำเนา" aria-label="ทำสำเนา"><i class="bi bi-copy"></i></button>
                <button class="btn btn-sm btn-soft-danger" data-delq="${i}" aria-label="ลบคำถาม"><i class="bi bi-trash"></i></button>
              </div>
            </div>
            <textarea class="form-control mb-2" rows="2" data-i="${i}" data-f="question_text" placeholder="พิมพ์คำถาม">${UI.esc(q.question_text)}</textarea>
            <input class="form-control form-control-sm mb-3" data-i="${i}" data-f="image_url" value="${UI.esc(q.image_url || '')}" placeholder="URL รูปภาพประกอบ (ถ้ามี)">
            <div>${optionsHtml(q, i)}</div>
            <details class="mt-2" ${q.explanation ? 'open' : ''}>
              <summary class="small text-muted">คำอธิบายเฉลย</summary>
              <textarea class="form-control form-control-sm mt-2" rows="2" data-i="${i}" data-f="explanation" placeholder="แสดงหลังส่งคำตอบ (ถ้าตั้งค่าให้แสดงเฉลย)">${UI.esc(q.explanation || '')}</textarea>
            </details>
          </div>
        </div>`).join('');
    }

    const list = UI.$('#qList');
    list.addEventListener('input', e => {
      const el = e.target;
      const i = Number(el.dataset.i);
      if (isNaN(i)) return;
      const q = qs[i];
      if (el.dataset.opt !== undefined) q.options[Number(el.dataset.opt)] = el.value;
      else if (el.dataset.f === 'answer_lines') q.answer = el.value.split('\n').map(s => s.trim()).filter(Boolean);
      else if (el.dataset.f === 'score') { q.score = el.value; summary(); }
      else if (el.dataset.f && el.dataset.f !== 'type') q[el.dataset.f] = el.value;
      setDirty();
    });
    list.addEventListener('change', e => {
      const el = e.target;
      const i = Number(el.dataset.i);
      if (isNaN(i)) return;
      const q = qs[i];
      if (el.dataset.f === 'type') {
        const n = newQ(el.value);
        n.question_text = q.question_text; n.image_url = q.image_url; n.explanation = q.explanation; n.question_id = q.question_id;
        if ((el.value === 'single' || el.value === 'multiple') && (q.type === 'single' || q.type === 'multiple')) { n.options = q.options; n.answer = el.value === 'single' ? q.answer.slice(0, 1) : q.answer; }
        qs[i] = n;
        render();
      } else if (el.dataset.correct !== undefined) {
        const j = Number(el.dataset.correct);
        if (q.type === 'multiple') q.answer = el.checked ? [...new Set([...q.answer, j])].sort() : q.answer.filter(x => x !== j);
        else q.answer = [j];
        render();
      }
      setDirty();
    });
    list.addEventListener('click', e => {
      const b = e.target.closest('button');
      if (!b) return;
      const i = Number(b.dataset.i ?? b.dataset.dup ?? b.dataset.delq);
      if (b.dataset.addopt !== undefined) { qs[i].options.push(''); }
      else if (b.dataset.delopt !== undefined) {
        const j = Number(b.dataset.delopt);
        const q = qs[i];
        q.options.splice(j, 1);
        q.answer = q.answer.filter(x => x !== j).map(x => (x > j ? x - 1 : x));
      }
      else if (b.dataset.move) { const j = i + Number(b.dataset.move); [qs[i], qs[j]] = [qs[j], qs[i]]; }
      else if (b.dataset.dup !== undefined) { const c = JSON.parse(JSON.stringify(qs[i])); delete c.question_id; qs.splice(i + 1, 0, c); }
      else if (b.dataset.delq !== undefined) { qs.splice(i, 1); }
      else return;
      setDirty();
      render();
    });

    UI.$('#addBtns').addEventListener('click', e => {
      const b = e.target.closest('[data-addq]');
      if (!b) return;
      qs.push(newQ(b.dataset.addq));
      setDirty();
      render();
      const el = UI.$('#q' + (qs.length - 1));
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
      el.querySelector('[data-f="question_text"]').focus();
    });

    UI.$('#saveBtn').addEventListener('click', async e => {
      const btn = e.currentTarget;
      UI.btnLoading(btn, true, 'กำลังบันทึก...');
      try {
        const r = await API.call('question.saveAll', { activity_id: id, questions: qs });
        setDirty(false);
        UI.toast(`บันทึกข้อสอบ ${r.saved} ข้อแล้ว`);
        const fresh = await API.call('question.list', { activity_id: id });
        qs = fresh.questions;
        render();
      } catch (err) {
        UI.error(err, 'บันทึกไม่สำเร็จ');
        const m = /ข้อ (\d+)/.exec(err.message);
        if (m) UI.$('#q' + (Number(m[1]) - 1))?.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
      UI.btnLoading(btn, false);
    });

    window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
  </script>
</body>
</html>
