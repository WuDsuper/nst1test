<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลืมรหัสผ่าน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
</head>
<body data-root="">
  <main class="auth-form-side" style="min-height:100vh">
    <div class="auth-card fade-up">
      <a href="index.html" class="auth-logo">
        <span class="brand-logo text-white" data-site-logo><i class="bi bi-mortarboard-fill"></i></span>
        <span class="name" data-site-name>ระบบฝึกอบรมออนไลน์</span>
      </a>
      <div class="card">
        <div class="card-body p-4 p-md-5">
          <div id="formBox">
            <div class="status-icon soft-warning" style="width:72px;height:72px;font-size:2rem"><i class="bi bi-key"></i></div>
            <h1 class="h3 fw-bold mb-1">ลืมรหัสผ่าน?</h1>
            <p class="text-muted mb-4">กรอกอีเมลที่ใช้สมัคร ระบบจะส่งลิงก์สำหรับตั้งรหัสผ่านใหม่ให้</p>
            <form id="fpForm" novalidate>
              <label class="form-label" for="email">อีเมล</label>
              <div class="input-group mb-4">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required>
              </div>
              <button class="btn btn-primary btn-lg w-100" type="submit" id="fpBtn"><i class="bi bi-send me-2"></i>ส่งลิงก์ตั้งรหัสผ่านใหม่</button>
            </form>
          </div>
          <div id="doneBox" class="d-none text-center">
            <div class="status-icon soft-success"><i class="bi bi-envelope-check"></i></div>
            <h2 class="h4 fw-bold">ตรวจสอบอีเมลของคุณ</h2>
            <p class="text-muted">หากอีเมลนี้มีอยู่ในระบบ คุณจะได้รับลิงก์สำหรับตั้งรหัสผ่านใหม่ภายในไม่กี่นาที (ลิงก์ใช้ได้ 1 ชั่วโมง)</p>
            <div id="demoLink"></div>
          </div>
        </div>
      </div>
      <p class="text-center mt-4"><a href="login.html" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>กลับไปหน้าเข้าสู่ระบบ</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    UI.loadSettings();
    UI.$('#fpForm').addEventListener('submit', async e => {
      e.preventDefault();
      const f = e.currentTarget;
      if (!f.checkValidity()) { f.classList.add('was-validated'); return; }
      const btn = UI.$('#fpBtn');
      UI.btnLoading(btn, true, 'กำลังส่ง...');
      try {
        const res = await API.call('forgotPassword', { email: f.email.value });
        if (res.demo_link) {
          UI.$('#demoLink').innerHTML = `<div class="demo-box text-start"><i class="bi bi-lightning-charge text-warning me-1"></i><b>โหมดทดลอง:</b> <a href="${res.demo_link}">คลิกเพื่อตั้งรหัสผ่านใหม่</a></div>`;
        }
        UI.$('#formBox').classList.add('d-none');
        UI.$('#doneBox').classList.remove('d-none');
      } catch (err) {
        UI.btnLoading(btn, false);
        UI.error(err);
      }
    });
  </script>
</body>
</html>
