<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ตั้งรหัสผ่านใหม่</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css" rel="stylesheet">
  <script src="assets/js/theme.js"></script>
</head>
<body data-root="">
  <main class="auth-form-side" style="min-height:100vh">
    <div class="auth-card fade-up">
      <a href="index.html" class="auth-logo">
        <span class="brand-logo text-white" data-site-logo><i class="bi bi-mortarboard-fill"></i></span>
        <span class="name" data-site-name>ระบบฝึกอบรมออนไลน์</span>
      </a>
      <div class="card">
        <div class="card-body p-4 p-md-5">
          <h1 class="h3 fw-bold mb-1">ตั้งรหัสผ่านใหม่</h1>
          <p class="text-muted mb-4">กำหนดรหัสผ่านใหม่สำหรับบัญชีของคุณ</p>
          <form id="rpForm" novalidate>
            <div class="mb-3">
              <label class="form-label" for="password">รหัสผ่านใหม่</label>
              <div class="input-group">
                <input type="password" class="form-control" id="password" name="password" minlength="8" autocomplete="new-password" required>
                <button class="btn btn-pw" type="button" data-toggle-password="password" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button>
              </div>
              <div class="pw-meter" id="pwMeter"><span></span><span></span><span></span><span></span></div>
              <div class="form-text" id="pwText">อย่างน้อย 8 ตัวอักษร ผสมตัวพิมพ์ใหญ่ เล็ก และตัวเลข</div>
            </div>
            <div class="mb-4">
              <label class="form-label" for="password2">ยืนยันรหัสผ่านใหม่</label>
              <div class="input-group has-validation">
                <input type="password" class="form-control" id="password2" name="password2" autocomplete="new-password" required>
                <button class="btn btn-pw" type="button" data-toggle-password="password2" aria-label="แสดงรหัสผ่าน"><i class="bi bi-eye"></i></button>
                <div class="invalid-feedback">รหัสผ่านไม่ตรงกัน</div>
              </div>
            </div>
            <button class="btn btn-primary btn-lg w-100" type="submit" id="rpBtn"><i class="bi bi-check2-circle me-2"></i>บันทึกรหัสผ่านใหม่</button>
          </form>
        </div>
      </div>
      <p class="text-center mt-4"><a href="login.html" class="text-decoration-none"><i class="bi bi-arrow-left me-1"></i>กลับไปหน้าเข้าสู่ระบบ</a></p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/mock.js"></script>
  <script src="assets/js/utils.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>
    UI.loadSettings();
    const form = UI.$('#rpForm');
    const token = UI.qs('token');
    UI.bindPasswordMeter(form.password, UI.$('#pwMeter'), UI.$('#pwText'));
    const checkMatch = () => form.password2.setCustomValidity(form.password2.value && form.password2.value !== form.password.value ? 'x' : '');
    form.password.addEventListener('input', checkMatch);
    form.password2.addEventListener('input', checkMatch);

    if (!token) UI.error('ลิงก์ไม่ถูกต้อง กรุณาขอรีเซ็ตรหัสผ่านใหม่').then(() => location.href = 'forgot-password.html');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      checkMatch();
      if (!form.checkValidity()) { form.classList.add('was-validated'); return; }
      const btn = UI.$('#rpBtn');
      UI.btnLoading(btn, true, 'กำลังบันทึก...');
      try {
        await API.call('resetPassword', { token, password: form.password.value });
        Auth.clear();
        await UI.success('ตั้งรหัสผ่านใหม่สำเร็จ', 'กรุณาเข้าสู่ระบบด้วยรหัสผ่านใหม่');
        location.href = 'login.html';
      } catch (err) {
        UI.btnLoading(btn, false);
        const r = await UI.error(err);
        if (err.code === 'EXPIRED') location.href = 'forgot-password.html';
      }
    });
  </script>
</body>
</html>
